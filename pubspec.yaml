name: brainrot_tracker_pro
description: "The upgraded short-form video tracker and anti-doomscroll ecosystem with rotting brain overlay."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Firebase Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_remote_config: ^5.1.3

  # Local Event-Sourced Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # UI, Charts & Icons
  fl_chart: ^0.69.0
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
